name: Scrape precon prices
# Runs daily at 01:23 UTC (6:23 PM PDT, 5:23 PM PST) and on manual trigger.
# TCGCSV republishes its TCGplayer snapshot around 20:05 UTC, so every run
# reads that evening's snapshot. GitHub often starts scheduled runs hours late;
# from 01:23 even a 10 hour delay stays on the same UTC date, so each history
# day gets exactly one snapshot. The odd minute avoids the top of hour queue.
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      allow_price_jumps:
        description: 'Let many decks or boxes move sharply since their previous day (an intentional matcher fix)'
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs.
permissions: {}

# Queue (don't cancel) so a manual run can't race a scheduled run on the
# commit/push of prices.json.
concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  # Runs every third party package (pip installs, the scraper, vendor data)
  # with a read only token, and hands the data files (the three top level
  # files and the card lists in cards/) to the commit job.
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        # v7.1.0 (6d4fd22b, 2026-10-22) fixes advisories in the action's bundled
        # undici and js-yaml; Dependabot proposes it once it is two weeks old.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install --require-hashes -r requirements.txt

      - name: Validate decks.json
        run: python test_data_integrity.py --catalog

      - name: Keep the last committed data for comparison
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          cp prices.json prices_history.json cards_index.json "$RUNNER_TEMP/previous/"

      - name: Run scraper
        run: python scrape_prices.py

      - name: Gate and test the new data
        # Refuse to publish a corrupt, partial or stale scrape: every data test,
        # coverage floors, upstream freshness, and no sharp drop against the
        # last committed run. See the --gate notes in test_data_integrity.py.
        # A manual run can set allow_price_jumps; scheduled runs never do.
        env:
          ALLOW_PRICE_JUMPS: ${{ inputs.allow_price_jumps && '1' || '' }}
        run: python test_data_integrity.py --gate --previous "$RUNNER_TEMP/previous"

      - name: Hand the data to the commit job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scraped-data
          path: |
            prices.json
            prices_history.json
            cards_index.json
            cards/decks/*.json
            cards/boxes/*.json
          if-no-files-found: error
          retention-days: 5

  # Holds the write token, so it runs no third party code: system git and the
  # runner's own python3 standard library only.
  commit:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the scraped data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scraped-data
          path: ${{ runner.temp }}/scraped

      - name: Check and place the data files
        # Only the expected files: the three top level files, and card lists
        # named cards/decks/<id>.json or cards/boxes/<code>.json. Each must
        # be strict JSON (no NaN or Infinity) and under the size cap. The
        # card folders are then made to match the artifact exactly, so a
        # list the scraper dropped is deleted; nothing else is ever deleted.
        run: |
          /usr/bin/python3 - "$RUNNER_TEMP/scraped" <<'PY'
          import json, math, pathlib, re, shutil, sys
          src = pathlib.Path(sys.argv[1])
          top = {"prices.json", "prices_history.json", "cards_index.json"}
          card_re = re.compile(r"cards/(decks|boxes)/[a-z0-9-]+\.json")
          got = {p.relative_to(src).as_posix() for p in src.rglob("*") if p.is_file()}
          assert top <= got, f"artifact lacks {sorted(top - got)}"
          odd = sorted(n for n in got - top if not card_re.fullmatch(n))
          assert not odd, f"unexpected artifact contents: {odd}"
          cards = sorted(got - top)
          assert len(cards) <= 1000, f"{len(cards)} card files is far more than expected"
          def bad(x):
              raise ValueError(f"non standard JSON number {x}")
          def finite(x):
              v = float(x)
              if not math.isfinite(v):
                  raise ValueError(f"number out of range: {x}")
              return v
          for name in sorted(got):
              f = src / name
              assert f.stat().st_size <= 8_000_000, f"{name} is over 8 MB"
              json.loads(f.read_text(encoding="utf-8"), parse_constant=bad, parse_float=finite)
          for name in sorted(top):
              shutil.copyfile(src / name, name)
          if cards:
              # A run without card lists keeps the committed ones as they are.
              keep = set(cards)
              for sub in ("decks", "boxes"):
                  folder = pathlib.Path("cards") / sub
                  folder.mkdir(parents=True, exist_ok=True)
                  for f in folder.iterdir():
                      rel = f"cards/{sub}/{f.name}"
                      if card_re.fullmatch(rel) and rel not in keep and f.is_file():
                          f.unlink()
              for name in cards:
                  shutil.copyfile(src / name, name)
          print(f"artifact OK: 3 data files, {len(cards)} card files")
          PY

      - name: Commit updated prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json prices_history.json cards_index.json
          git add --all -- cards/decks cards/boxes
          if git diff --staged --quiet; then
            echo "No price changes today."
            exit 0
          fi
          git commit -m "prices: automated update $(date -u +%Y-%m-%d)"
          # Pull any commits that landed during the scrape, then push.
          # Rebase keeps our commit on top; --autostash handles any stray changes.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
          echo "Push failed after 3 attempts"
          exit 1
